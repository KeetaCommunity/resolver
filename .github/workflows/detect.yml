name: detect

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        network: [main]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Always writes the body file. The PR action makes no PR when there is no diff.
      - run: node bin/detect.ts ${{ matrix.network }} pr-body.md
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: sources-update-${{ matrix.network }}
          title: "sources: ${{ matrix.network }}"
          body-path: pr-body.md
          commit-message: "Update ${{ matrix.network }} snapshots"
          add-paths: networks/${{ matrix.network }}/snapshots
          delete-branch: true
